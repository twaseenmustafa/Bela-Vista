<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bela Vista Resort</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Italiana&family=Shadows+Into+Light&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sand: '#F9F9F4',
              navy: '#0F172A',
              gold: '#D4AF37',
              goldhover: '#B5952F',
              charcoal: '#333333',
              offwhite: '#F5F5F0',
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Montserrat"', 'sans-serif'],
              chisel: ['"Cinzel"', 'serif'],
              majestic: ['"Italiana"', 'serif'], /* Simulating Majestic Vision */
              hand: ['"Shadows Into Light"', 'cursive'], /* The cozy Shadow Hand style */
            },
            letterSpacing: {
              widest: '.25em',
            }
          }
        }
      }
    </script>
    
    <style>
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F9F9F4;
      }
      ::-webkit-scrollbar-thumb {
        background: #D4AF37;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #B5952F;
      }
      
      /* Lenis Recommended CSS */
      html.lenis, html.lenis body {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }
      .lenis.lenis-scrolling iframe {
        pointer-events: none;
      }

      /* GridMotion Styles */
      .noscroll {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      .intro {
        width: 100%;
        height: 80vh; /* Adjusted for better fit within section */
        min-height: 600px;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .intro::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: 250px;
        pointer-events: none;
        z-index: 4;
      }

      .gridMotion-container {
        gap: 1rem;
        flex: none;
        position: relative;
        width: 150vw;
        height: 150vh;
        display: grid;
        grid-template-rows: repeat(4, 1fr);
        grid-template-columns: 100%;
        transform: rotate(-15deg);
        transform-origin: center center;
        z-index: 2;
      }

      .row {
        display: flex;
        flex-wrap: nowrap;
        gap: 1rem;
        width: max-content;
        will-change: transform;
      }

      .row__item {
        position: relative;
        flex: 0 0 22vw; /* Matches the previous grid 1fr width (150vw / 7 approx) */
        height: 100%;
      }

      .row__item-inner {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 10px;
        background-color: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.5rem;
      }

      .row__item-img {
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: 50% 50%;
        position: absolute;
        top: 0;
        left: 0;
        will-change: transform;
      }

      .row__item-content {
        padding: 1rem;
        text-align: center;
        z-index: 1;
      }

      .fullview {
        position: relative;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
      }

      .fullview .row__item-inner {
        border-radius: 0px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react/": "https://esm.sh/react@18.3.1/",
    "react": "https://esm.sh/react@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8?external=react,react-dom",
    "gsap": "https://esm.sh/gsap@3.12.5",
    "gsap/ScrollTrigger": "https://esm.sh/gsap@3.12.5/ScrollTrigger",
    "gsap/": "https://esm.sh/gsap@^3.14.2/",
    "lenis": "https://esm.sh/lenis@^1.3.17",
    "lottie-react": "https://esm.sh/lottie-react@2.4.0?external=react,react-dom"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-sand text-charcoal antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
